# Replace the IP and private-key path with the outputs/credentials for your EC2 VM.
[app_servers]
ikiminapay ansible_host=REPLACE_WITH_TERRAFORM_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/REPLACE_WITH_KEY.pem ansible_python_interpreter=/usr/bin/python3

[app_servers:vars]
# Terraform opens host port 8000; the app listens on port 3000 inside the container.
app_repository=https://github.com/Ibrahim-Iradukunda/IkiminaPay.git
app_version=main
app_checkout_dir=/opt/ikiminapay
app_container_name=ikiminapay
app_image_name=ikiminapay
app_host_port=8000
app_container_port=3000
app_data_volume=ikiminapay-data
