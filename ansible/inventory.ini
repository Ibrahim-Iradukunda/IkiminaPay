# Copy Terraform outputs into these host fields before running Ansible locally.
# Never store a private key in this file or commit it to the repository.
[app_servers]
ikiminapay-app ansible_host=REPLACE_WITH_APP_PRIVATE_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/ikiminapay.pem ansible_ssh_common_args='-o ProxyJump=ec2-user@REPLACE_WITH_BASTION_PUBLIC_IP'

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
aws_region=us-east-1
app_port=3000
app_image=REPLACE_WITH_ECR_URL_AND_TAG

[proxy_servers]
ikiminapay-proxy ansible_host=REPLACE_WITH_BASTION_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/ikiminapay.pem

[proxy_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_private_ip=REPLACE_WITH_APP_PRIVATE_IP
