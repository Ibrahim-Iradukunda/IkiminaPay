# Copy Terraform outputs into these fields before running Ansible locally.
# Keep the private key outside the repository; never commit it here.
[app_servers]
ikiminapay-app ansible_host=REPLACE_WITH_APP_PRIVATE_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/REPLACE_WITH_KEY_NAME ansible_ssh_common_args='-o ProxyJump=ec2-user@REPLACE_WITH_BASTION_PUBLIC_IP'

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
aws_region=REPLACE_WITH_AWS_REGION
app_port=3000
app_image=REPLACE_WITH_ACCOUNT_ID.dkr.ecr.REPLACE_WITH_AWS_REGION.amazonaws.com/ikiminapay:REPLACE_WITH_IMAGE_TAG

[proxy_servers]
ikiminapay-proxy ansible_host=REPLACE_WITH_BASTION_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/REPLACE_WITH_KEY_NAME

[proxy_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_private_ip=REPLACE_WITH_APP_PRIVATE_IP
