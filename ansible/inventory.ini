# Copy Terraform outputs into these host fields before running Ansible locally.
# Never store a private key in this file or commit it to the repository.
[app_servers]
ikiminapay-app ansible_host=10.0.11.80 ansible_user=ec2-user ansible_ssh_private_key_file=/home/ibragold/.ssh/alu-devops ansible_ssh_common_args='-o ProxyCommand="ssh -o IdentitiesOnly=yes -i /home/ibragold/.ssh/alu-devops -W %h:%p ec2-user@13.48.177.237"'

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
aws_region=eu-north-1
app_port=3000
app_image=141538081586.dkr.ecr.eu-north-1.amazonaws.com/ikiminapay:latest

[proxy_servers]
ikiminapay-proxy ansible_host=13.48.177.237 ansible_user=ec2-user ansible_ssh_private_key_file=/home/ibragold/.ssh/alu-devops

[proxy_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_private_ip=10.0.11.80
