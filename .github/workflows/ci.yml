name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Get the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js 20 and cache npm packages
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install exact dependency versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Run ESLint (fails the pipeline on errors)
      - name: Run lint
        run: npm run lint

      # Run Jest tests (fails the pipeline on failures)
      - name: Run tests
        run: npm test

      # Build the Docker image (fails if the Dockerfile is broken)
      - name: Build Docker image
        run: docker build -t ikiminapay:ci .


      # Confirmed real release: aquasecurity/trivy-action v0.36.0.
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
           image-ref: ikiminapay:ci
           severity: HIGH,CRITICAL
           exit-code: '1'
           ignore-unfixed: true

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Checkov exceptions previously used for these checks are intentionally not retained:
      # - CKV_AWS_130: public-IP assignment is disabled for the public subnet and EC2 instance.
      # - CKV_AWS_88: the EC2 instance no longer receives a public IP.
      # - CKV_AWS_382: the security group now allows only explicit HTTP, HTTPS, and DNS egress.
      # - CKV_AWS_136: the ECR repository uses a customer-managed KMS key.
      # - CKV2_AWS_11: a CloudWatch-based VPC flow log is configured for the VPC.
      # - CKV2_AWS_41: the EC2 instance has an IAM role and instance profile.
      - name: Scan terraform with checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform