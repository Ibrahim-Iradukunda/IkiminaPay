name: Deploy to Production

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  ci:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    if: github.event.pull_request.merged == true
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      BASTION_HOST: ${{ vars.BASTION_HOST }}
      APP_PRIVATE_IP: ${{ vars.APP_PRIVATE_IP }}
      BASTION_SECURITY_GROUP_ID: ${{ vars.BASTION_SECURITY_GROUP_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install "ansible-core>=2.16,<3"

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the immutable release image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if aws ecr describe-images \
            --repository-name ikiminapay \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>"$RUNNER_TEMP/ecr-image-check.log"; then
            echo "Image tag $IMAGE_TAG already exists; reusing the immutable release."
          elif grep -q "ImageNotFoundException" "$RUNNER_TEMP/ecr-image-check.log"; then
            docker build --tag "$ECR_REPOSITORY_URL:$IMAGE_TAG" .
            docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
          else
            cat "$RUNNER_TEMP/ecr-image-check.log" >&2
            exit 1
          fi

      - name: Get this runner's public IPv4 address
        id: runner-ip
        run: |
          set -euo pipefail
          ip="$(curl --fail --silent --show-error --ipv4 https://checkip.amazonaws.com | tr -d '\r\n')"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow SSH from this runner
        env:
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -euo pipefail
          aws ec2 authorize-security-group-ingress \
            --group-id "$BASTION_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32"

      - name: Prepare Ansible SSH access and inventory
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BASTION_SSH_PRIVATE_KEY }}
          BASTION_KNOWN_HOSTS: ${{ secrets.BASTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/ikiminapay.pem"
          chmod 600 "$RUNNER_TEMP/ssh/ikiminapay.pem"
          printf '%s\n' "$BASTION_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

          cat > "$RUNNER_TEMP/inventory.ini" <<EOF
          [app_servers]
          ikiminapay-app ansible_host=$APP_PRIVATE_IP ansible_user=ec2-user ansible_ssh_private_key_file=$RUNNER_TEMP/ssh/ikiminapay.pem ansible_ssh_common_args='-o ProxyJump=ec2-user@$BASTION_HOST -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=accept-new'

          [app_servers:vars]
          ansible_python_interpreter=/usr/bin/python3

          [proxy_servers]
          ikiminapay-proxy ansible_host=$BASTION_HOST ansible_user=ec2-user ansible_ssh_private_key_file=$RUNNER_TEMP/ssh/ikiminapay.pem ansible_ssh_common_args='-o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes'

          [proxy_servers:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Deploy the image and configure the public proxy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ansible-playbook \
            --inventory "$RUNNER_TEMP/inventory.ini" \
            ansible/deploy.yml \
            --extra-vars "aws_region=$AWS_REGION app_image=$ECR_REPOSITORY_URL:$IMAGE_TAG app_private_ip=$APP_PRIVATE_IP app_port=3000"

      - name: Revoke temporary SSH access
        if: ${{ always() && steps.runner-ip.outputs.ip != '' }}
        env:
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$BASTION_SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32"
