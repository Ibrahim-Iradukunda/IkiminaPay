
services:
  app:
    build: .
    image: ikiminapay-app
    container_name: ikiminapay-app

    env_file: .env

    environment:
      DB_HOST: postgres
      DB_SSL: "false"

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ikiminapay-net

    restart: unless-stopped

    # Check whether the application is responding on its health endpoint.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: ikiminapay-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - ikiminapay-net

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:

networks:
  ikiminapay-net:
    driver: bridge
