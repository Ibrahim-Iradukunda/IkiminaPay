services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ikiminapay}
      POSTGRES_USER: ${DB_USER:-ikiminapay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ikiminapay-local-only}
    volumes:
      - ikiminapay-db-data:/var/lib/postgresql/data
    networks:
      - ikiminapay-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ikiminapay} -d ${DB_NAME:-ikiminapay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ikiminapay-app
    container_name: ikiminapay-app

    # Values from .env (copy .env.example to .env first).
    # .env is excluded by .dockerignore, so Compose passes the values in here.
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_SSL: "false"

    command: ["sh", "-c", "node data/init-db.js && node server.js"]

    depends_on:
      db:
        condition: service_healthy

    # Host port : container port. Both follow PORT so they always match.
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    networks:
      - ikiminapay-net

    # Restart after crashes, but not after `docker compose stop`/`down`.
    restart: unless-stopped

    # The image has no curl/wget, so use Node 22's built-in fetch.
    # GET / serves public/index.html. Exits 1 if the request fails or the status is not 2xx.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + (process.env.PORT || 3000) + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ikiminapay-db-data:

networks:
  ikiminapay-net:
    driver: bridge
